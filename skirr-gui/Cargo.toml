[package]
name = "skirr-gui"
version = "0.1.0"
edition = "2021"
description = "Tauri GUI for Skirr USB diagnostic tool"
license = "MIT"
repository = "https://github.com/klangche/skirr"

[dependencies]
skirr-core = { path = "../skirr-core" }
skirr-windows = { path = "../skirr-windows", optional = true }
skirr-macos = { path = "../skirr-macos", optional = true }
skirr-linux = { path = "../skirr-linux", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
skirr-windows = { path = "../skirr-windows", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
skirr-macos = { path = "../skirr-macos", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
skirr-linux = { path = "../skirr-linux", optional = true }

[dependencies.tauri]
workspace = true
optional = true

[features]
default = []
gui = ["dep:tauri"]
windows-backend = ["dep:skirr-windows"]
macos-backend = ["dep:skirr-macos"]
linux-backend = ["dep:skirr-linux"]