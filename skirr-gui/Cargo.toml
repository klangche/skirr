[package]
name = "skirr-gui"
version = "0.1.0"
edition = "2021"
description = "Tauri GUI for Skirr USB diagnostic tool"
license = "MIT"
repository = "https://github.com/klangche/skirr"

[dependencies]
skirr-core = { path = "../skirr-core" }
skirr-windows = { path = "../skirr-windows", optional = true }
skirr-macos = { path = "../skirr-macos", optional = true }
skirr-linux = { path = "../skirr-linux", optional = true }
tauri = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
skirr-windows = { path = "../skirr-windows" }

[target.'cfg(target_os = "macos")'.dependencies]
skirr-macos = { path = "../skirr-macos" }

[target.'cfg(target_os = "linux")'.dependencies]
skirr-linux = { path = "../skirr-linux" }

[features]
default = []