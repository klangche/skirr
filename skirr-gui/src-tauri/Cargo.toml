[package]
name = "skirr-gui"
version = "0.1.0"
edition = "2021"
description = "Tauri GUI for Skirr USB diagnostic tool"
license = "MIT"
repository = "https://github.com/klangche/skirr"
default-run = "skirr-gui"

# Standalone app crate: excluded from the root workspace on purpose (its own
# lockfile, Tauri deps don't burden CLI/backend builds).
[workspace]

[[bin]]
name = "skirr-gui"
path = "src/main.rs"

[dependencies]
skirr-core = { path = "../../skirr-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
skirr-macos = { path = "../../skirr-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
skirr-windows = { path = "../../skirr-windows" }

[target.'cfg(target_os = "linux")'.dependencies]
skirr-linux = { path = "../../skirr-linux" }

[dependencies.tauri]
version = "2"
features = []

[dependencies.tauri-plugin-dialog]
version = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
