name: Release

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "skirr-*/**"
      - "Cargo.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: skirr-windows-x64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: skirr-macos-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: skirr-linux-amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: skirr-gui/src-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: skirr-gui/src-tauri

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE="0.1.0"
          RUN="${GITHUB_RUN_NUMBER}"
          if [ "${{ github.ref_name }}" = "main" ]; then
            VERSION="${BASE}-beta.${RUN}"
          else
            VERSION="${BASE}-alpha.${RUN}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp version
        if: steps.version.outputs.version != '0.1.0'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          cd ../..
          for toml in skirr-*/Cargo.toml; do
            sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" "$toml"
            rm -f "$toml.bak"
          done
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" skirr-gui/src-tauri/tauri.conf.json
          rm -f skirr-gui/src-tauri/tauri.conf.json.bak

      - name: Build (macOS)
        if: runner.os == 'MacOS'
        shell: bash
        run: |
          set -euo pipefail
          cargo tauri build --target ${{ matrix.target }} --bundles app

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo tauri build --target ${{ matrix.target }} --bundles nsis

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          cargo tauri build --target ${{ matrix.target }} --bundles deb

      - name: Package macOS DMG
        if: runner.os == 'MacOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          APP="target/release/bundle/macos/Skirr.app"
          mkdir -p dist/dmg-staging
          cp -R "$APP" dist/dmg-staging/
          ln -s /Applications dist/dmg-staging/Applications
          cat > dist/dmg-staging/HOW\ TO\ RUN.txt <<NOTE
          Skirr v${VERSION} (macOS, Apple Silicon)

          FIRST LAUNCH - ONE-TIME STEP
          ----------------------------
          The app is not notarized yet ("until Apple approves the app"),
          so macOS blocks the very first start of a downloaded copy.

          Copy and paste this line into Terminal and press Enter to be able
          to run the app:

              xattr -dr com.apple.quarantine /Applications/Skirr.app

          This un-quarantines the app. It is only necessary once; afterwards
          Skirr opens normally every time.

          ALTERNATIVE (no Terminal)
          -------------------------
          Double-click Skirr.app once. When macOS says it cannot verify the
          app, go to System Settings > Privacy & Security and click
          "Open Anyway" next to the Skirr message.

          INSTALLING
          ----------
          Drag Skirr.app into the Applications folder first (the shortcut
          above points there).
          NOTE
          hdiutil create -volname "Skirr ${VERSION}" -srcfolder dist/dmg-staging \
            -format UDZO -ov "skirr-macos-arm64.dmg"
          shasum -a 256 "skirr-macos-arm64.dmg" > "skirr-macos-arm64.dmg.sha256"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path target/release/bundle/nsis -Filter "*.exe" | Select-Object -First 1
          Write-Host "Found installer: $($exe.FullName)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create tag
        run: |
          VERSION="0.1.0-alpha.${GITHUB_RUN_NUMBER}"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v0.1.0-alpha.${{ github.run_number }}"
          files: dist/*
          generate_release_notes: true
