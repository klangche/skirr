name: Release

# Tag-triggered release builds. Runs even while CI's automatic triggers are
# paused: cutting a release is always a deliberate manual act.
on:
  push:
    branches:
      - main
      - dev
    paths:
      - "skirr-*/**"
      - "Cargo.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: skirr-windows-x64
          # Universal binary: both slices built on the Apple Silicon runner
          # via cross-compilation — the macos-13 Intel runner pool queues for
          # days, and lipo needs no Intel hardware at all.
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: skirr-macos-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: skirr-linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets || matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE="0.1.0"
          RUN="${GITHUB_RUN_NUMBER}"
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "version=${BASE}-beta.${RUN}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${BASE}-alpha.${RUN}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp version in Cargo.toml
        if: steps.version.outputs.version != '0.1.0'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          for toml in skirr-*/Cargo.toml; do
            sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" "$toml"
            rm -f "$toml.bak"
          done

      - name: Build (release)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p skirr-cli --target ${{ matrix.target }}

      - name: Package (Windows portable .zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/skirr.exe dist/
          Compress-Archive -Path dist/skirr.exe -DestinationPath ${{ matrix.artifact }}.zip
          Get-FileHash ${{ matrix.artifact }}.zip -Algorithm SHA256 | Out-File ${{ matrix.artifact }}.zip.sha256

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./target/${{ matrix.target }}/release/skirr.exe --help

      - name: Package (macOS .app -> .dmg)
        if: runner.os == 'MacOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          APP="Skirr.app"
          mkdir -p "dist/$APP/Contents/MacOS" "dist/dmg-staging"
          cp "target/${{ matrix.target }}/release/skirr" "dist/$APP/Contents/MacOS/skirr"
          cat > "dist/$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Skirr</string>
            <key>CFBundleIdentifier</key><string>io.github.klangche.skirr</string>
            <key>CFBundleExecutable</key><string>skirr</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          codesign --force --deep -s - "dist/$APP"
          "./dist/$APP/Contents/MacOS/skirr" --help > /dev/null
          cp -R "dist/$APP" dist/dmg-staging/
          ln -s /Applications dist/dmg-staging/Applications
          cat > dist/dmg-staging/HOW\ TO\ RUN.txt <<NOTE
          Skirr v${VERSION} (macOS, Apple Silicon)

          FIRST LAUNCH - ONE-TIME STEP
          ----------------------------
          The app is not notarized yet ("until Apple approves the app"),
          so macOS blocks the very first start of a downloaded copy.

          Copy and paste this line into Terminal and press Enter to be able
          to run the app:

              xattr -dr com.apple.quarantine /Applications/Skirr.app

          This un-quarantines the app. It is only necessary once; afterwards
          Skirr opens normally every time.

          ALTERNATIVE (no Terminal)
          -------------------------
          Double-click Skirr.app once. When macOS says it cannot verify the
          app, go to System Settings > Privacy & Security and click
          "Open Anyway" next to the Skirr message.

          INSTALLING
          ----------
          Drag Skirr.app into the Applications folder first (the shortcut
          above points there).

          ADVANCED: CLI
          -------------
          /Applications/Skirr.app/Contents/MacOS/skirr --help
          NOTE
          hdiutil create -volname "Skirr ${VERSION}" -srcfolder dist/dmg-staging \
            -format UDZO -ov "${{ matrix.artifact }}.dmg"
          shasum -a 256 "${{ matrix.artifact }}.dmg" > "${{ matrix.artifact }}.dmg.sha256"

      - name: Package (Linux .deb)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          STAGING="dist/skirr_${VERSION}_amd64"
          mkdir -p "$STAGING/DEBIAN" "$STAGING/usr/bin"
          install -m 755 "target/${{ matrix.target }}/release/skirr" "$STAGING/usr/bin/skirr"
          cat > "$STAGING/DEBIAN/control" <<CONTROL
          Package: skirr
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: klangche <skirr@klangche.io>
          Description: Cross-platform USB analysis and diagnostic tool
           Enumerates USB devices, reconstructs bus topology, detects speed
           mismatches, monitors hotplug events, and diagnoses stability
           issues using rule-based analysis.
          CONTROL
          # Smoke test before packing.
          "$STAGING/usr/bin/skirr" --help > /dev/null
          dpkg-deb --build "$STAGING"
          mv "$STAGING.deb" "${{ matrix.artifact }}.deb"
          sha256sum "${{ matrix.artifact }}.deb" > "${{ matrix.artifact }}.deb.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.zip
            *.zip.sha256
            *.dmg
            *.dmg.sha256
            *.deb
            *.deb.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
