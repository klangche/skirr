name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-14
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Stamp version suffix
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [[ "$BRANCH" == "main" ]]; then
            SUFFIX="beta"
          else
            SUFFIX="alpha"
          fi
          VERSION_SUFFIX="${SUFFIX}.${GITHUB_RUN_NUMBER}"
          for toml in skirr-*/Cargo.toml; do
            sed -i.bak "s/^version = \"0\.1\.0\"/version = \"0.1.0-${VERSION_SUFFIX}\"/" "$toml"
            rm -f "${toml}.bak"
          done
          echo "Stamped version suffix: ${VERSION_SUFFIX}"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Smoke test: CLI must at least start on a USB-less runner
      - run: cargo run -p skirr-cli -- --help

  build:
    name: release-${{ matrix.artifact }}
    needs: test
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: skirr-windows-x64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: skirr-macos-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: skirr-linux-amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: skirr-gui/src-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: skirr-gui/src-tauri

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE="0.1.0"
          RUN="${GITHUB_RUN_NUMBER}"
          if [ "${{ github.ref_name }}" = "main" ]; then
            VERSION="${BASE}-beta.${RUN}"
          else
            VERSION="${BASE}-alpha.${RUN}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp version
        if: steps.version.outputs.version != '0.1.0'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          cd ../..
          for toml in skirr-*/Cargo.toml; do
            sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" "$toml"
            rm -f "$toml.bak"
          done
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" skirr-gui/src-tauri/tauri.conf.json
          rm -f skirr-gui/src-tauri/tauri.conf.json.bak

      - name: Build (macOS)
        if: runner.os == 'MacOS'
        shell: bash
        run: |
          set -euo pipefail
          cargo tauri build --bundles app
          APP_PATH=$(find target -path "*/bundle/macos/Skirr.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Found .app at: $APP_PATH"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo tauri build --bundles nsis

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          cargo tauri build --bundles deb

      - name: Package macOS DMG
        if: runner.os == 'MacOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist/dmg-staging
          cp -R "${{ env.APP_PATH }}" dist/dmg-staging/
          ln -s /Applications dist/dmg-staging/Applications
          cat > dist/dmg-staging/HOW\ TO\ RUN.txt <<NOTE
          Skirr v${VERSION} (macOS, Apple Silicon)

          FIRST LAUNCH - ONE-TIME STEP
          ----------------------------
          The app is not notarized yet ("until Apple approves the app"),
          so macOS blocks the very first start of a downloaded copy.

          Copy and paste this line into Terminal and press Enter to be able
          to run the app:

              xattr -dr com.apple.quarantine /Applications/Skirr.app

          This un-quarantines the app. It is only necessary once; afterwards
          Skirr opens normally every time.

          ALTERNATIVE (no Terminal)
          -------------------------
          Double-click Skirr.app once. When macOS says it cannot verify the
          app, go to System Settings > Privacy & Security and click
          "Open Anyway" next to the Skirr message.

          INSTALLING
          ----------
          Drag Skirr.app into the Applications folder first (the shortcut
          above points there).
          NOTE
          hdiutil create -volname "Skirr ${VERSION}" -srcfolder dist/dmg-staging \
            -format UDZO -ov "skirr-macos-arm64.dmg"
          shasum -a 256 "skirr-macos-arm64.dmg" > "skirr-macos-arm64.dmg.sha256"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path target/release/bundle/nsis -Filter "*.exe" | Select-Object -First 1
          Write-Host "Found installer: $($exe.FullName)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            skirr-gui/src-tauri/skirr-*.dmg
            skirr-gui/src-tauri/skirr-*.dmg.sha256
            skirr-gui/src-tauri/target/release/bundle/nsis/*.exe
            skirr-gui/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE="0.1.0"
          RUN="${GITHUB_RUN_NUMBER}"
          if [ "${{ github.ref_name }}" = "main" ]; then
            VERSION="${BASE}-beta.${RUN}"
          else
            VERSION="${BASE}-alpha.${RUN}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          files: dist/*
          generate_release_notes: true
