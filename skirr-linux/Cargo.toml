[package]
name = "skirr-linux"
version = "0.1.0"
edition = "2021"
description = "Linux backend for Skirr using sysfs, libusb, and udev"
license = "MIT"
repository = "https://github.com/klangche/skirr"

[dependencies]
skirr-core = { path = "../skirr-core" }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
libudev = { workspace = true }
nix = { workspace = true }
libusb = { workspace = true }
bitflags = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[features]
default = []